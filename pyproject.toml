[tool.poetry]
name = "bttf-cart"
version = "0.1.0"
description = "Calculeur de panier DVD « Back to the Future » — exercice technique Ekinox"
authors = ["Yegor Gaidar <maingaidar@gmail.com>"]
readme = "README.md"
packages = [{ include = "bttf", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
click = "^8.1.0"
pydantic = "^2.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-cov = "^5.0.0"
hypothesis = "^6.100.0"
ruff = "^0.5.0"
mypy = "^1.10.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=bttf --cov-report=term-missing --cov-fail-under=95 -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# `assert` et `subprocess` sont légitimes dans les tests.
"tests/*" = ["S101", "S603"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
