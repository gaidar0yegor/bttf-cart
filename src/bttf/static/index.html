<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BTTF DVD Shop — Promotion 2000</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f23;
      --panel: #1a1c3c;
      --panel-2: #232552;
      --ink: #e4e6ff;
      --muted: #8b8ec7;
      --amber: #ffb000;
      --amber-hi: #ffd75e;
      --green: #00e436;
      --blue: #29adff;
      --red: #ff4d4f;
      --line: #000;
      /* Палитра CRT 8-bit */
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(900px 420px at 75% -10%, #232552 0%, transparent 55%),
        radial-gradient(700px 380px at 10% 110%, #1e2340 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      font-family: "Courier New", ui-monospace, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      image-rendering: pixelated;
    }
    /* ── Пиксельная рамка: box-shadow лесенкой ─────────────── */
    .px {
      border: 4px solid var(--line);
      box-shadow:
        0 -4px 0 0 var(--line),
        0 4px 0 0 var(--line),
        -4px 0 0 0 var(--line),
        4px 0 0 0 var(--line),
        inset 0 -4px 0 0 rgba(0, 0, 0, 0.35);
    }
    .card {
      width: 100%;
      max-width: 620px;
      background: var(--panel);
      padding: 26px;
      position: relative;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: -8px;
      border: 4px solid var(--amber);
      box-shadow:
        0 -4px 0 0 #000, 0 4px 0 0 #000,
        -4px 0 0 0 #000, 4px 0 0 0 #000;
      pointer-events: none;
    }
    .badge {
      display: inline-block;
      font-family: "Press Start 2P", "Courier New", monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--green);
      background: var(--panel-2);
      border: 3px solid var(--line);
      box-shadow: 3px 3px 0 0 #000;
      padding: 6px 10px;
      margin-bottom: 16px;
      text-shadow: 2px 2px 0 #000;
      /* Clignote 2 fois (effet CRT), puis s'arrête. */
      animation: badge-blink 0.5s steps(2, jump-none) 2;
    }
    @keyframes badge-blink {
      50% { opacity: 0; }
    }
    h1 {
      margin: 0 0 10px;
      font-family: "Press Start 2P", "Courier New", monospace;
      font-size: 20px;
      line-height: 1.5;
      text-transform: uppercase;
      text-shadow: 3px 3px 0 #000;
    }
    h1 .flux { color: var(--amber); }
    .subtitle {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin: 0 0 20px;
    }
    label {
      display: block;
      font-family: "Press Start 2P", "Courier New", monospace;
      font-size: 10px;
      color: var(--blue);
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    textarea {
      width: 100%;
      min-height: 120px;
      background: #0a0a1c;
      color: var(--ink);
      border: 3px solid var(--line);
      box-shadow: inset 0 0 0 3px #232552;
      padding: 12px;
      font: inherit;
      font-size: 15px;
      resize: vertical;
      outline: none;
    }
    textarea:focus { box-shadow: inset 0 0 0 3px var(--amber); }
    .presets { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 20px; }
    .presets button {
      background: var(--panel-2);
      color: var(--ink);
      border: 3px solid var(--line);
      box-shadow: 3px 3px 0 0 #000;
      font-family: "Press Start 2P", "Courier New", monospace;
      font-size: 8px;
      padding: 8px 10px;
      cursor: pointer;
      text-transform: uppercase;
      transition: none;
    }
    .presets button:hover {
      background: var(--amber);
      color: #000;
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 0 #000;
    }
    .presets button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 0 #000; }
    .btn {
      width: 100%;
      background: var(--amber);
      color: #0f0f23;
      border: 4px solid var(--line);
      box-shadow: 0 6px 0 0 #000, inset 0 2px 0 0 var(--amber-hi);
      font-family: "Press Start 2P", "Courier New", monospace;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 16px 18px;
      cursor: pointer;
    }
    .btn:hover { background: var(--amber-hi); }
    .btn:active {
      transform: translateY(6px);
      box-shadow: 0 0 0 0 #000, inset 0 2px 0 0 var(--amber-hi);
    }
    #status { font-size: 13px; min-height: 18px; margin-top: 14px; }
    #status.err { color: var(--red); }
    #status.ok { color: var(--green); }
    .result {
      display: none;
      margin-top: 20px;
      border-top: 3px dashed #3a3d7a;
      padding-top: 14px;
      /* Apparition douce du détail du calcul. */
      animation: result-in 0.15s ease-out;
    }
    @keyframes result-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .result.visible { display: block; }
    .result table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .result td { padding: 7px 4px; }
    .result td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    .result .muted { color: var(--muted); }
    .result .discount { color: var(--green); }
    .result .total-row td {
      border-top: 3px solid var(--line);
      margin-top: 6px;
      padding-top: 14px;
      font-family: "Press Start 2P", "Courier New", monospace;
      font-size: 11px;
      letter-spacing: 1px;
    }
    .total-row .big {
      color: var(--amber);
      font-size: 22px;
      text-shadow: 3px 3px 0 #000;
      /* Le total clignote 2 fois : l'œil va directement au prix. */
      animation: total-blink 0.4s steps(2, jump-none) 2;
    }
    @keyframes total-blink {
      50% { opacity: 0.25; }
    }
    .footer {
      margin-top: 24px;
      font-family: "Press Start 2P", "Courier New", monospace;
      font-size: 8px;
      color: var(--muted);
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .footer .bolt { color: var(--amber); }
  </style>
</head>
<body>
  <main class="card px">
    <span class="badge">★ PROMOTION 2000 ★</span>
    <h1>DVD <span class="flux">Back to the</span> Future</h1>
    <p class="subtitle">1 volet : 15&nbsp;€ · 2 volets différents : −10&nbsp;% · 3 volets : −20&nbsp;% · autres films : 20&nbsp;€</p>

    <label for="cart">▸ ENTRER LE PANIER (1 FILM / LIGNE)</label>
    <textarea id="cart" spellcheck="false"
      placeholder="Back to the Future 1&#10;Back to the Future 2&#10;La chèvre"></textarea>

    <div class="presets">
      <button data-cart="Back to the Future 1&#10;Back to the Future 2&#10;Back to the Future 3">EX.1 · 3 volets</button>
      <button data-cart="Back to the Future 1&#10;Back to the Future 3">EX.2 · 2 volets</button>
      <button data-cart="Back to the Future 1&#10;Back to the Future 2&#10;Back to the Future 3&#10;Back to the Future 2">EX.4 · doublon</button>
      <button data-cart="Back to the Future 1&#10;Back to the Future 2&#10;Back to the Future 3&#10;La chèvre">EX.5 · + film</button>
    </div>

    <button class="btn" id="compute">⏎ CALCULER</button>
    <p id="status" role="status"></p>

    <section class="result" id="result" aria-live="polite">
      <table>
        <tbody>
          <tr><td class="muted">Sous-total</td><td id="r-subtotal"></td></tr>
          <tr><td class="muted">DVD de la saga</td><td id="r-saga"></td></tr>
          <tr><td class="muted">Autres films</td><td id="r-other"></td></tr>
          <tr class="discount"><td>Remise</td><td id="r-discount"></td></tr>
          <tr class="total-row"><td>TOTAL</td><td class="big" id="r-total"></td></tr>
        </tbody>
      </table>
    </section>

    <p class="footer"><span class="bolt">⚡88 mph⚡</span> · Ekinox exercise · 2000</p>
  </main>

  <script>
    const cartInput = document.getElementById("cart");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");

    document.querySelectorAll(".presets button").forEach((btn) => {
      btn.addEventListener("click", () => {
        cartInput.value = btn.dataset.cart;
        statusEl.textContent = "";
        statusEl.className = "";
        resultEl.classList.remove("visible");
      });
    });

    document.getElementById("compute").addEventListener("click", async () => {
      statusEl.className = "";
      resultEl.classList.remove("visible");
      try {
        const res = await fetch("/api/price", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cart_text: cartInput.value }),
        });
        const body = await res.json();
        if (!res.ok) {
          statusEl.className = "err";
          statusEl.textContent = body.detail || "Erreur inconnue.";
          return;
        }
        const b = body.breakdown;
        document.getElementById("r-subtotal").textContent = b.subtotal + " €";
        document.getElementById("r-saga").textContent = b.saga_line_total + " €";
        document.getElementById("r-other").textContent = b.other_line_total + " €";
        document.getElementById("r-discount").textContent =
          "−" + b.discount_percent + " % (" + b.discount_amount + " €)";
        document.getElementById("r-total").textContent = body.total + " €";
        resultEl.classList.add("visible");
        statusEl.className = "ok";
        statusEl.textContent = "✓ Prix calculé : " + body.total + " €";
      } catch (err) {
        statusEl.className = "err";
        statusEl.textContent = "Impossible de joindre l'API.";
      }
    });
  </script>
</body>
</html>
